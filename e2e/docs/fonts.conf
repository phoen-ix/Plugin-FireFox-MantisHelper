<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The tour's fonts (playwright.docs.config.ts points Firefox at this file),
     so the screenshots do not depend on what the host maps the generic
     families to: form controls use the system font (sans-serif), and the
     unstyled hint page uses serif. The fonts-liberation package provides both;
     Playwright's install with deps installs it. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
