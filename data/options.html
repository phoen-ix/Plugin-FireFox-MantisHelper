<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mantis Helper Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    form {
      display: flex;
      flex-direction: column;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      margin-bottom: 8px;
    }
    input {
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    #preview {
      margin: 0 0 20px;
      color: #555;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin: 12px 0 0;
      min-height: 1.2em;
      color: #1a7f37;
    }
  </style>
</head>
<body>
  <form id="optionsForm">
    <h1>Mantis Helper Options</h1>
    <label for="customUrl">Mantis URL:</label>
    <input type="url" id="customUrl" size="100" required placeholder="https://mantis.example.com/" aria-describedby="preview">
    <p id="preview"></p>
    <button type="submit">Save</button>
    <p id="status" role="status"></p>
  </form>
  <script src="mantis.js"></script>
  <script src="options.js"></script>
</body>
</html>
